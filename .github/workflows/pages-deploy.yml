name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'README.md'
      - 'GIT_IO.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log deployment
        run: |
          echo "✓ Deployment triggered"
          echo "Files changed in docs/"
          git diff HEAD~1..HEAD --name-only -- docs/ || echo "No previous commit"
