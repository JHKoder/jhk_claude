<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Snapshot __ROOT_HASH__</title>
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #0b0e18;
            --bg2: #0d111e;
            --bg3: #0f1320;
            --bg4: #111827;
            --bg5: #1a2035;
            --border: rgba(255, 255, 255, .07);
            --border2: rgba(255, 255, 255, .04);
            --text: #c9d1e0;
            --text2: #718096;
            --text3: #4a5568;
            --accent: #805ad5;
            --blue: #63b3ed;
            --cyan: #90cdf4;
            --green: #68d391;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 13px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden
        }

        a {
            color: var(--blue);
            text-decoration: none
        }

        /* global header */
        .global-header {
            padding: 8px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg3);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .snap-badge {
            font-family: monospace;
            font-size: 11px;
            color: #b794f4;
            background: rgba(128, 90, 213, .15);
            border: 1px solid rgba(128, 90, 213, .3);
            border-radius: 4px;
            padding: 2px 8px;
            white-space: nowrap;
            flex-shrink: 0
        }

        .snap-nav-btn {
            background: var(--bg5);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap
        }

        .snap-nav-btn:hover {
            color: var(--text);
            border-color: #4a5568
        }

        .cmd-search {
            flex: 1;
            background: var(--bg4);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 12px;
            outline: none;
            max-width: 360px
        }

        .cmd-search:focus {
            border-color: var(--accent)
        }

        .cmd-search::placeholder {
            color: var(--text3)
        }

        .global-right {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-left: auto
        }

        .token-badge {
            font-size: 10px;
            color: #68d391;
            background: rgba(104, 211, 145, .1);
            border: 1px solid rgba(104, 211, 145, .25);
            border-radius: 3px;
            padding: 2px 7px;
            white-space: nowrap
        }

        /* 3-col split */
        .split {
            display: grid;
            grid-template-columns:260px 1fr 0px;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            transition: grid-template-columns .2s ease
        }

        .split.inspector-open {
            grid-template-columns:260px 1fr 300px
        }

        /* left panel */
        .tree-panel {
            background: var(--bg2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-right: 1px solid rgba(255, 255, 255, .08)
        }

        .search-wrap {
            padding: 8px 10px;
            border-bottom: 1px solid var(--border2);
            flex-shrink: 0
        }

        .search-input {
            width: 100%;
            background: var(--bg4);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 11px;
            outline: none
        }

        .search-input::placeholder {
            color: var(--text3)
        }

        .search-input:focus {
            border-color: #2d3748
        }

        /* sidebar controls */
        .sidebar-ctrl {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            padding: 5px 8px;
            border-bottom: 1px solid var(--border2);
            flex-shrink: 0
        }

        .ctrl-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text3);
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            transition: color .1s, border-color .1s
        }

        .ctrl-btn:hover {
            color: var(--text);
            border-color: #4a5568
        }

        .tree-scroll {
            overflow-y: auto;
            flex: 1
        }

        /* folder row */
        .folder-row {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            cursor: pointer;
            user-select: none;
            border-left: 3px solid transparent
        }

        .folder-row:hover {
            background: var(--bg5)
        }

        .folder-toggle {
            font-size: 9px;
            color: var(--text3);
            width: 10px;
            text-align: center;
            flex-shrink: 0
        }

        .folder-icon {
            font-size: 12px;
            flex-shrink: 0
        }

        .folder-name {
            font-size: 11px;
            color: var(--text2);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        /* file row */
        .file-row {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            cursor: pointer;
            border-left: 3px solid transparent;
            transition: background .1s, border-color .1s
        }

        .file-row:hover {
            background: var(--bg5);
            border-left-color: #2d3748
        }

        .file-row.active {
            background: var(--bg5);
            border-left-color: var(--accent)
        }

        .file-icon {
            font-size: 11px;
            flex-shrink: 0
        }

        .file-name {
            font-size: 12px;
            color: var(--cyan);
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1
        }

        .file-name mark {
            background: rgba(128, 90, 213, .35);
            color: #e9d8fd;
            border-radius: 2px
        }

        /* center viewer */
        .viewer-panel {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0
        }

        .viewer-header {
            padding: 8px 16px;
            background: rgba(255, 255, 255, .03);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 4px;
            flex: 1;
            overflow: hidden;
            min-width: 0
        }

        .bc-seg {
            font-family: monospace;
            font-size: 12px;
            color: var(--text2);
            white-space: nowrap
        }

        .bc-sep {
            color: var(--text3);
            font-size: 11px;
            flex-shrink: 0
        }

        .bc-seg:last-child {
            color: var(--cyan)
        }

        .action-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0
        }

        .badge {
            font-size: 10px;
            color: var(--text3);
            background: var(--bg5);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 2px 6px;
            white-space: nowrap
        }

        .icon-btn {
            background: var(--bg5);
            border: 1px solid #2d3748;
            color: var(--blue);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            white-space: nowrap;
            transition: background .1s
        }

        .icon-btn:hover {
            background: #2a3550
        }

        .icon-btn.active {
            border-color: var(--accent);
            color: var(--accent)
        }

        .tab-bar {
            display: flex;
            gap: 2px;
            padding: 0 16px;
            background: #0a0d16;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .tab-btn {
            padding: 6px 14px;
            font-size: 11px;
            border: none;
            background: none;
            cursor: pointer;
            color: var(--text2);
            border-bottom: 2px solid transparent;
            transition: color .15s, border-color .15s
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .tab-btn:hover:not(.active) {
            color: var(--text)
        }

        .code-wrap {
            flex: 1;
            overflow: auto;
            display: flex;
            min-height: 0
        }

        .line-nums {
            padding: 14px 0;
            background: var(--bg2);
            text-align: right;
            user-select: none;
            flex-shrink: 0;
            border-right: 1px solid var(--border2)
        }

        .line-num {
            display: block;
            padding: 0 10px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.7;
            color: var(--text3)
        }

        .code-content {
            padding: 14px 16px;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.7;
            white-space: pre;
            color: var(--text);
            flex: 1;
            min-width: 0
        }

        .code-content.wrap {
            white-space: pre-wrap;
            word-break: break-all
        }

        .md-preview {
            flex: 1;
            overflow: auto;
            padding: 20px 28px;
            color: var(--text);
            line-height: 1.7;
            font-size: 13px
        }

        .md-preview h1, .md-preview h2, .md-preview h3 {
            color: #e2e8f0;
            margin: 1.2em 0 .5em;
            border-bottom: 1px solid var(--border);
            padding-bottom: .3em
        }

        .md-preview h1 {
            font-size: 1.5em
        }

        .md-preview h2 {
            font-size: 1.25em
        }

        .md-preview h3 {
            font-size: 1.1em
        }

        .md-preview code {
            background: var(--bg5);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 11px;
            color: #b794f4
        }

        .md-preview pre {
            background: var(--bg4);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 14px 16px;
            overflow-x: auto;
            margin: .8em 0
        }

        .md-preview pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text);
            font-size: 12px
        }

        .md-preview blockquote {
            border-left: 3px solid var(--accent);
            margin: 0;
            padding: 6px 14px;
            color: var(--text2);
            background: var(--bg4);
            border-radius: 0 4px 4px 0
        }

        .md-preview table {
            border-collapse: collapse;
            width: 100%;
            margin: .8em 0
        }

        .md-preview th {
            background: var(--bg4);
            padding: 6px 12px;
            border: 1px solid var(--border);
            color: #e2e8f0;
            font-size: 12px
        }

        .md-preview td {
            padding: 5px 12px;
            border: 1px solid var(--border);
            font-size: 12px
        }

        .md-preview a {
            color: var(--blue)
        }

        .md-preview hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 1.5em 0
        }

        .md-preview ul, .md-preview ol {
            padding-left: 1.5em;
            margin: .5em 0
        }

        .md-preview p {
            margin: .5em 0
        }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text3);
            font-size: 13px;
            flex-direction: column;
            gap: 10px
        }

        .hljs {
            background: transparent !important;
            padding: 0 !important;
            font-size: 12px !important;
            line-height: 1.7 !important
        }

        /* right inspector */
        .inspector-panel {
            background: var(--bg2);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-width: 0
        }

        .inspector-tabs {
            display: flex;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0
        }

        .ins-tab {
            flex: 1;
            padding: 7px 4px;
            font-size: 10px;
            text-align: center;
            border: none;
            background: none;
            color: var(--text2);
            cursor: pointer;
            border-bottom: 2px solid transparent
        }

        .ins-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent)
        }

        .ins-tab:hover:not(.active) {
            color: var(--text)
        }

        /* guide panel */
        .guide-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 10px;
            font-size: 11px;
            line-height: 1.6;
            color: var(--text2)
        }

        .guide-section {
            margin-bottom: 14px
        }

        .guide-title {
            font-size: 10px;
            font-weight: 600;
            color: #b794f4;
            letter-spacing: .05em;
            text-transform: uppercase;
            margin-bottom: 6px;
            padding-bottom: 4px;
            border-bottom: 1px solid var(--border)
        }

        .guide-item {
            display: flex;
            gap: 6px;
            margin-bottom: 5px;
            align-items: flex-start
        }

        .guide-key {
            background: var(--bg5);
            border: 1px solid var(--border);
            border-radius: 3px;
            padding: 1px 5px;
            font-family: monospace;
            font-size: 10px;
            color: var(--cyan);
            white-space: nowrap;
            flex-shrink: 0
        }

        .guide-desc {
            color: var(--text2);
            font-size: 11px
        }

        .guide-badge {
            display: inline-block;
            padding: 1px 5px;
            border-radius: 3px;
            font-size: 10px;
            font-family: monospace;
            white-space: nowrap
        }

        .guide-badge.purple {
            background: rgba(128, 90, 213, .15);
            color: #b794f4;
            border: 1px solid rgba(128, 90, 213, .3)
        }

        .guide-badge.blue {
            background: rgba(99, 179, 237, .15);
            color: #63b3ed;
            border: 1px solid rgba(99, 179, 237, .3)
        }

        .guide-badge.green {
            background: rgba(104, 211, 145, .15);
            color: #68d391;
            border: 1px solid rgba(104, 211, 145, .3)
        }

        .guide-badge.red {
            background: rgba(252, 129, 129, .15);
            color: #fc8181;
            border: 1px solid rgba(252, 129, 129, .3)
        }

        .guide-tip {
            background: rgba(128, 90, 213, .07);
            border-left: 2px solid #805ad5;
            padding: 5px 8px;
            border-radius: 0 4px 4px 0;
            font-size: 11px;
            color: var(--text2);
            margin-top: 4px
        }

        .inspector-body {
            flex: 1;
            overflow-y: auto;
            padding: 10px 8px
        }

        .toc-item {
            display: block;
            padding: 3px 0 3px 6px;
            font-size: 11px;
            color: var(--text2);
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
            border-left: 2px solid transparent;
            transition: color .1s, border-color .1s
        }

        .toc-item:hover {
            color: var(--cyan);
            border-left-color: var(--cyan)
        }

        .toc-h1 {
            font-weight: 600;
            color: var(--text)
        }

        .toc-h2 {
            padding-left: 14px
        }

        .toc-h3 {
            padding-left: 22px;
            font-size: 10px;
            color: var(--text3)
        }

        .meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid var(--border2);
            font-size: 11px
        }

        .meta-label {
            color: var(--text3)
        }

        .meta-value {
            color: var(--text);
            font-family: monospace
        }

        .progress-wrap {
            margin: 6px 0 10px
        }

        .progress-label {
            font-size: 10px;
            color: var(--text3);
            margin-bottom: 3px;
            display: flex;
            justify-content: space-between
        }

        .progress-bar {
            height: 4px;
            background: var(--bg5);
            border-radius: 2px;
            overflow: hidden
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            border-radius: 2px;
            transition: width .3s
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 5px;
            margin-top: 10px
        }

        .qa-btn {
            background: var(--bg4);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 11px;
            cursor: pointer;
            text-align: left;
            transition: background .1s, color .1s
        }

        .qa-btn:hover {
            background: var(--bg5);
            color: var(--text)
        }

        /* diff pane */
        .diff-pane {
            display: none;
            flex: 1;
            overflow: hidden;
            min-height: 0
        }

        .diff-pane.visible {
            display: flex;
            flex-direction: column
        }

        .diff-split {
            display: grid;
            grid-template-columns:1fr 1fr;
            flex: 1;
            overflow: hidden;
            min-height: 0;
            gap: 1px;
            background: var(--border)
        }

        .diff-col {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: var(--bg)
        }

        .diff-col-header {
            padding: 5px 12px;
            background: var(--bg3);
            font-size: 11px;
            color: var(--text2);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            font-family: monospace;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .diff-scroll {
            flex: 1;
            overflow: auto
        }

        .diff-table {
            width: 100%;
            border-collapse: collapse;
            font-family: monospace;
            font-size: 12px;
            line-height: 1.7
        }

        .diff-ln {
            width: 36px;
            min-width: 36px;
            text-align: right;
            padding: 0 8px;
            color: var(--text3);
            user-select: none;
            background: var(--bg2);
            border-right: 1px solid var(--border2);
            white-space: nowrap
        }

        .diff-code {
            padding: 0 12px;
            white-space: pre;
            color: var(--text)
        }

        .diff-add {
            background: rgba(72, 187, 120, .15)
        }

        .diff-add .diff-ln {
            background: rgba(72, 187, 120, .08)
        }

        .diff-add .diff-code {
            color: #9ae6b4
        }

        .diff-del {
            background: rgba(245, 101, 101, .15)
        }

        .diff-del .diff-ln {
            background: rgba(245, 101, 101, .08)
        }

        .diff-del .diff-code {
            color: #fc8181
        }

        .diff-no-change-notice {
            display: flex;
            align-items: center;
            justify-content: center;
            flex: 1;
            color: var(--text3);
            font-size: 12px
        }

        /* scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px
        }

        ::-webkit-scrollbar-track {
            background: transparent
        }

        ::-webkit-scrollbar-thumb {
            background: #2d3748;
            border-radius: 3px
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #4a5568
        }
    </style>
</head>
<body>
<script id="manifestData" type="application/json">__MANIFEST_JSON__</script>
<!-- Global Header -->
<div class="global-header">
    <a href="/" style="font-size:11px;color:var(--text3);flex-shrink:0">← 대시보드</a>
    <div class="snap-badge">__ROOT_HASH_SHORT__</div>
    <select class="snap-nav-btn" id="snapSelect" onchange="navigateSnapshot(this.value)" title="스냅샷 이동">
        <option value="">스냅샷 이동…</option>
    </select>
    <input class="cmd-search" id="cmdSearch" type="text" placeholder="⌘K  파일 / 경로 검색…" autocomplete="off">
    <div class="global-right">
        <span class="token-badge" id="tokenBadge">계산 중…</span>
        <button class="icon-btn" onclick="copyAllConfig()">📋 Copy All</button>
        <a class="icon-btn" id="exportBtn" href="/snapshot/__ROOT_HASH__/export"
           download="snapshot-__ROOT_HASH_SHORT__.snap">↓ Export</a>
        <button class="icon-btn" id="diffBtn" onclick="toggleDiff()">🔀 Diff</button>
        <button class="icon-btn" id="inspectorBtn" onclick="toggleInspector()">▶ Inspector</button>
    </div>
</div>
<!-- 3-column split -->
<div class="split" id="split">
    <!-- Left: tree -->
    <div class="tree-panel">
        <div class="search-wrap">
            <input class="search-input" id="searchInput" type="text" placeholder="파일 / 경로 검색…" autocomplete="off">
        </div>
        <div class="sidebar-ctrl">
            <button class="ctrl-btn" onclick="expandAll()">모두 펼치기</button>
            <button class="ctrl-btn" onclick="collapseAll()">모두 접기</button>
        </div>
        <div class="tree-scroll" id="treeScroll"></div>
    </div>
    <!-- Center: viewer -->
    <div class="viewer-panel">
        <div class="viewer-header">
            <div class="breadcrumb" id="breadcrumb"><span style="color:var(--text3);font-size:12px">파일을 선택하세요</span>
            </div>
            <div class="action-bar">
                <span class="badge" id="fileBadge"></span>
                <button class="icon-btn" id="wrapBtn" onclick="toggleWrap()" title="줄바꿈 토글">↩ Wrap</button>
                <button class="icon-btn" id="copyBtn" onclick="copyCode()">📋 Copy</button>
            </div>
        </div>
        <div class="tab-bar" id="tabBar" style="display:none">
            <button class="tab-btn active" id="tabPreview" onclick="switchTab('preview')">📝 Preview</button>
            <button class="tab-btn" id="tabCode" onclick="switchTab('code')">💻 Code</button>
        </div>
        <div class="code-wrap" id="codeWrap">
            <div class="empty-state">
                <span style="font-size:28px">📂</span>
                <span>좌측 목록에서 파일을 선택하세요</span>
            </div>
        </div>
        <div class="diff-pane" id="diffPane">
            <div id="diffBase"
                 style="padding:6px 14px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:11px;color:var(--text2);flex-shrink:0">
                <span>비교 기준: </span>
                <select id="diffBaseSelect"
                        style="background:var(--bg4);border:1px solid var(--border);color:var(--text);padding:2px 6px;border-radius:4px;font-size:11px;cursor:pointer"
                        onchange="onDiffBaseChange(this.value)">
                    <option value="">로드 중…</option>
                </select>
            </div>
            <div class="diff-split" id="diffSplit">
                <div class="diff-col">
                    <div class="diff-col-header" id="diffLeftHeader">이전</div>
                    <div class="diff-scroll" id="diffLeft"></div>
                </div>
                <div class="diff-col">
                    <div class="diff-col-header" id="diffRightHeader">현재</div>
                    <div class="diff-scroll" id="diffRight"></div>
                </div>
            </div>
        </div>
    </div>
    <!-- Right: inspector -->
    <div class="inspector-panel" id="inspectorPanel">
        <div class="inspector-tabs">
            <button class="ins-tab" id="insToc" onclick="switchIns('toc')">📑 목차</button>
            <button class="ins-tab" id="insMeta" onclick="switchIns('meta')">📊 메타</button>
            <button class="ins-tab active" id="insGuide" onclick="switchIns('guide')">📖 설명서</button>
        </div>
        <div class="inspector-body" id="inspectorBody"></div>
    </div>
</div>
<script>
    const FILES = __FILES_JSON__;
    const MANIFEST = JSON.parse(document.getElementById('manifestData').textContent);

    const EXT_ICON = {
        md: '📄',
        sh: '⚙️',
        json: '🔧',
        jsonc: '🔧',
        yaml: '🔧',
        yml: '🔧',
        py: '🐍',
        java: '☕',
        gradle: '🏗️',
        xml: '📋',
        txt: '📝'
    };

    function extIcon(path) {
        const ext = path.includes('.') ? path.split('.').pop().toLowerCase() : '';
        return EXT_ICON[ext] || '📄';
    }

    function buildTree(files) {
        const root = {dirs: {}, files: []};
        files.forEach((f, idx) => {
            const parts = f.path.split('/');
            let node = root;
            for (let i = 0; i < parts.length - 1; i++) {
                const seg = parts[i];
                if (!node.dirs[seg]) node.dirs[seg] = {dirs: {}, files: []};
                node = node.dirs[seg];
            }
            node.files.push(idx);
        });
        return root;
    }

    let activeIdx = -1;
    let currentContent = '';
    let currentExt = '';
    let currentTab = 'code';
    let wrapMode = false;
    let inspectorOpen = true;
    let insTab = 'guide';
    let diffMode = false;
    let openFolders = new Set();
    const NL = String.fromCharCode(10);
    const ROOT_HASH = '__ROOT_HASH__';
    let filesLoaded = false;
    let filesLoading = false;

    function hl(text, q) {
        if (!q) return text;
        return text.replace(
            new RegExp('(' + q.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&') + ')', 'gi'),
            '<mark>$1</mark>'
        );
    }

    let _folderCounter = 0;
    const _folderKeyMap = {};

    function renderNode(node, pathKey, depth, q, buf) {
        const folderIndent = depth * 20 + 8;
        const fileIndent = depth * 20 + 28;

        Object.keys(node.dirs).sort().forEach(seg => {
            const childKey = pathKey ? pathKey + '/' + seg : seg;
            const fid = 'fd' + (_folderCounter++);
            _folderKeyMap[fid] = childKey;
            const isOpen = q ? true : openFolders.has(childKey);
            buf.push(
                `<div class="folder-row" style="padding-left:${folderIndent}px" onclick="toggleFolder('${fid}')">` +
                `<span class="folder-toggle">${isOpen ? '▼' : '▶'}</span>` +
                `<span class="folder-icon">${isOpen ? '📂' : '📁'}</span>` +
                `<span class="folder-name">${hl(seg, q)}</span>` +
                `</div>`
            );
            buf.push('<div class="folder-children" id="' + fid + '"' + (isOpen ? '' : ' style="display:none"') + '>');
            renderNode(node.dirs[seg], childKey, depth + 1, q, buf);
            buf.push('</div>');
        });

        node.files.forEach(idx => {
            const f = FILES[idx];
            const fname = f.path.split('/').pop();
            if (q && !f.path.toLowerCase().includes(q)) return;
            const activeCls = idx === activeIdx ? ' active' : '';
            const failMark = f.parse_failed
                ? '<span style="font-size:9px;color:#fc8181;background:rgba(252,129,129,.15);border:1px solid rgba(252,129,129,.3);border-radius:3px;padding:0 4px;margin-left:4px;flex-shrink:0">파싱실패</span>'
                : '';
            buf.push(
                '<div class="file-row' + activeCls + '" data-idx="' + idx + '"' +
                ' style="padding-left:' + fileIndent + 'px' + (f.parse_failed ? ';opacity:.7' : '') + '"' +
                ' onclick="selectFile(' + idx + ')" title="' + f.path + (f.parse_failed ? ' (파싱 실패)' : '') + '">' +
                '<span class="file-icon">' + (f.parse_failed ? '⚠️' : extIcon(f.path)) + '</span>' +
                '<span class="file-name">' + hl(fname, q) + '</span>' +
                failMark +
                '</div>'
            );
        });
    }

    function renderTree(query) {
        _folderCounter = 0;
        const q = (query || '').toLowerCase().trim();
        const scroll = document.getElementById('treeScroll');
        const tree = buildTree(FILES);
        const buf = [];
        renderNode(tree, '', 0, q, buf);
        scroll.innerHTML = buf.join('') ||
            '<div style="padding:20px;text-align:center;color:var(--text3);font-size:12px">결과 없음</div>';
    }

    function toggleFolder(fid) {
        const el = document.getElementById(fid);
        if (!el) return;
        const isOpen = el.style.display !== 'none';
        el.style.display = isOpen ? 'none' : '';
        const row = el.previousElementSibling;
        if (row) {
            row.querySelector('.folder-toggle').textContent = isOpen ? '▶' : '▼';
            row.querySelector('.folder-icon').textContent = isOpen ? '📁' : '📂';
        }
        const key = _folderKeyMap[fid];
        if (key) {
            if (isOpen) openFolders.delete(key);
            else openFolders.add(key);
        }
    }

    async function ensureFilesLoaded() {
        if (filesLoaded || filesLoading) return;
        filesLoading = true;
        try {
            const res = await fetch('/snapshot/' + ROOT_HASH + '/files');
            const data = await res.json();
            FILES.forEach(function (f) {
                const entry = data[f.path];
                if (entry !== undefined) {
                    f.content = entry.content || '';
                    f.parse_failed = entry.parse_failed || false;
                } else {
                    f.parse_failed = true;
                }
            });
            filesLoaded = true;
        } catch (e) {
            console.error('files load error', e);
        }
        filesLoading = false;
    }

    async function selectFile(idx) {
        const f = FILES[idx];
        if (!f) return;

        // 파일 내용이 아직 없으면 먼저 로드
        if (f.content === null && !f.parse_failed) {
            document.getElementById('codeWrap').innerHTML =
                '<div class="empty-state"><span style="font-size:20px">⏳</span><span style="margin-top:6px">로딩 중…</span></div>';
            await ensureFilesLoaded();
        }

        activeIdx = idx;
        currentContent = f.parse_failed ? '' : (f.content || '');
        currentExt = f.path.includes('.') ? f.path.split('.').pop().toLowerCase() : '';

        document.querySelectorAll('.file-row').forEach(el => el.classList.remove('active'));
        const el = document.querySelector('.file-row[data-idx="' + idx + '"]');
        if (el) el.classList.add('active');

        const parts = f.path.split('/');
        document.getElementById('breadcrumb').innerHTML = parts.map((p, i) =>
            '<span class="bc-seg">' + p + '</span>' + (i < parts.length - 1 ? '<span class="bc-sep">›</span>' : '')
        ).join('');

        if (f.parse_failed) {
            document.getElementById('fileBadge').textContent = '파싱 실패';
            document.getElementById('tabBar').style.display = 'none';
            document.getElementById('codeWrap').innerHTML =
                '<div class="empty-state" style="flex-direction:column;gap:8px">' +
                '<span style="font-size:24px">⚠️</span>' +
                '<span style="color:#fc8181;font-size:13px">파싱 실패</span>' +
                '<span style="color:var(--text3);font-size:11px">이 파일의 내용을 스냅샷에서 추출하지 못했습니다.</span>' +
                '<span style="color:var(--text3);font-size:10px;font-family:monospace">' + f.path + '</span>' +
                '</div>';
            updateInspector();
            return;
        }

        const lines = currentContent ? currentContent.split(NL) : [];
        const bytes = new Blob([currentContent]).size;
        document.getElementById('fileBadge').textContent =
            lines.length + ' lines · ' + (bytes < 1024 ? bytes + ' B' : (bytes / 1024).toFixed(1) + ' KB');

        const isMd = currentExt === 'md';
        document.getElementById('tabBar').style.display = isMd ? '' : 'none';
        currentTab = isMd ? 'preview' : 'code';
        if (isMd) {
            document.getElementById('tabPreview').classList.add('active');
            document.getElementById('tabCode').classList.remove('active');
        }

        if (diffMode) {
            renderDiff();
        } else {
            renderContent();
        }
        updateInspector();
    }

    function renderContent() {
        const wrap = document.getElementById('codeWrap');
        if (!currentContent) {
            wrap.innerHTML = '<div class="empty-state"><span>(빈 파일)</span></div>';
            return;
        }

        if (currentTab === 'preview' && currentExt === 'md') {
            wrap.innerHTML = '<div class="md-preview">' + marked.parse(currentContent) + '</div>';
            return;
        }

        const lines = currentContent.split(NL);
        const nums = lines.map(function (_, i) {
            return '<span class="line-num">' + (i + 1) + '</span>';
        }).join('');

        const langMap = {
            sh: 'bash', bash: 'bash', md: 'markdown', json: 'json', jsonc: 'json',
            yaml: 'yaml', yml: 'yaml', py: 'python', java: 'java', gradle: 'groovy', xml: 'xml',
            html: 'xml', txt: 'plaintext', properties: 'properties'
        };
        const lang = langMap[currentExt] || 'plaintext';
        let highlighted;
        try {
            highlighted = hljs.highlight(currentContent, {language: lang}).value;
        } catch (e) {
            highlighted = currentContent.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        const wrapCls = wrapMode ? ' wrap' : '';
        wrap.innerHTML = '<div class="line-nums">' + nums + '</div><div class="code-content' + wrapCls + ' hljs">' + highlighted + '</div>';
    }

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('tabPreview').classList.toggle('active', tab === 'preview');
        document.getElementById('tabCode').classList.toggle('active', tab === 'code');
        renderContent();
    }

    function toggleWrap() {
        wrapMode = !wrapMode;
        document.getElementById('wrapBtn').classList.toggle('active', wrapMode);
        const cc = document.querySelector('.code-content');
        if (cc) cc.classList.toggle('wrap', wrapMode);
    }

    function copyCode() {
        if (!currentContent) return;
        navigator.clipboard.writeText(currentContent).then(function () {
            const btn = document.getElementById('copyBtn');
            btn.textContent = '✓ Copied!';
            btn.style.color = '#68d391';
            setTimeout(function () {
                btn.textContent = '📋 Copy';
                btn.style.color = '';
            }, 1500);
        }).catch(function () {
            alert('클립보드 접근 실패');
        });
    }

    function expandAll() {
        document.querySelectorAll('.folder-children').forEach(function (el) {
            el.style.display = '';
            const row = el.previousElementSibling;
            if (row) {
                row.querySelector('.folder-toggle').textContent = '▼';
                row.querySelector('.folder-icon').textContent = '📂';
            }
        });
        Object.values(_folderKeyMap).forEach(function (k) {
            openFolders.add(k);
        });
    }

    function collapseAll() {
        document.querySelectorAll('.folder-children').forEach(function (el) {
            el.style.display = 'none';
            const row = el.previousElementSibling;
            if (row) {
                row.querySelector('.folder-toggle').textContent = '▶';
                row.querySelector('.folder-icon').textContent = '📁';
            }
        });
        openFolders.clear();
    }

    function estimateTokens(text) {
        return Math.round((text || '').length / 4);
    }

    function updateTokenBadge() {
        if (!filesLoaded) {
            document.getElementById('tokenBadge').textContent = FILES.length + '개 파일';
            return;
        }
        const total = FILES.reduce(function (s, f) {
            return s + estimateTokens(f.content);
        }, 0);
        const k = total >= 1000 ? (total / 1000).toFixed(1) + 'k' : String(total);
        document.getElementById('tokenBadge').textContent = 'Total: ' + k + ' tks';
    }

    function toggleInspector() {
        inspectorOpen = !inspectorOpen;
        document.getElementById('split').classList.toggle('inspector-open', inspectorOpen);
        document.getElementById('inspectorBtn').classList.toggle('active', inspectorOpen);
        if (inspectorOpen) updateInspector();
    }

    function switchIns(tab) {
        insTab = tab;
        document.getElementById('insToc').classList.toggle('active', tab === 'toc');
        document.getElementById('insMeta').classList.toggle('active', tab === 'meta');
        document.getElementById('insGuide').classList.toggle('active', tab === 'guide');
        updateInspector();
    }

    function updateInspector() {
        if (!inspectorOpen) return;
        const body = document.getElementById('inspectorBody');
        if (insTab === 'toc') renderToc(body);
        else if (insTab === 'meta') renderMeta(body);
        else if (insTab === 'guide') renderGuide(body);
    }

    function renderGuide(body) {
        if (guideRendered) return;
        guideRendered = true;
        body.innerHTML = `

</div>
<div style="padding:10px 12px;overflow-y:auto;max-height:calc(100vh - 140px)">

<div class="guide-section">

  <div class="guide-item"><span class="guide-key">좌측</span><span class="guide-desc">파일 트리 — 클릭으로 파일 선택</span></div>
  <div class="guide-item"><span class="guide-key">중앙</span><span class="guide-desc">파일 뷰어 — 코드 / 마크다운 미리보기</span></div>
  <div class="guide-item"><span class="guide-key">우측</span><span class="guide-desc">이 패널 (목차 · 메타 · 설명서)</span></div>
</div>

<div class="guide-section">

  <div class="guide-item"><span class="guide-key">← 대시보드</span><span class="guide-desc">메인 대시보드로 돌아가기</span></div>
  <div class="guide-item"><span class="guide-key">스냅샷 이동</span><span class="guide-desc">다른 스냅샷으로 이동</span></div>

  <div class="guide-item"><span class="guide-key">▶ Inspector</span><span class="guide-desc">우측 패널 열기 / 닫기</span></div>

  </div>

</div>

<div class="guide-section">
  <div class="guide-title">Inspector 탭</div>
  <div class="guide-item"><span class="guide-key">📑 목차</span><span class="guide-desc">.md 파일의 헤더 목차 빠른 이동</span></div>
  <div class="guide-item"><span class="guide-key">📊 메타</span><span class="guide-desc">파일 크기 · 라인 수 · 토큰 예상치</span></div>
  <div class="guide-item"><span class="guide-key">📖 설명서</span><span class="guide-desc">이 화면 사용법 요약</span></div>
</div>

<div style="margin-top:12px;padding:8px;background:var(--bg4);border-radius:5px;border:1px solid var(--border)">
  <div style="font-size:10px;color:var(--text3);text-align:center">스냅샷은 Claude Code 세션 종료 시<br>자동으로 수집됩니다</div>

    }

    function renderToc(body) {
        if (currentExt !== 'md' || !currentContent) {
            body.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px">.md 파일 선택 시 목차 표시</div>';
            return;
        }
        const lines = currentContent.split(NL);
        const items = [];
        lines.forEach(function (line, i) {
            const m = line.match(/^(#{1,3})[ \t]+(.+)/);
            if (m) items.push({level: m[1].length, text: m[2], lineIdx: i});
        });
        if (!items.length) {
            body.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px">헤더 없음</div>';
            return;
        }
        body.innerHTML = items.map(function (it) {
            return '<a class="toc-item toc-h' + it.level + '" onclick="scrollToLine(' + it.lineIdx + ')" href="javascript:void(0)">' + it.text + '</a>';
        }).join('');
    }

    function scrollToLine(lineIdx) {
        const wrap = document.getElementById('codeWrap');
        wrap.scrollTop = lineIdx * 20;
    }

    function renderMeta(body) {
        if (activeIdx < 0) {
            body.innerHTML = '<div style="color:var(--text3);font-size:11px;padding:8px">파일을 선택하세요</div>';
            return;
        }
        const f = FILES[activeIdx];
        const lines = f.content ? f.content.split(NL) : [];
        const bytes = new Blob([f.content || '']).size;
        const tokens = estimateTokens(f.content);
        const maxTokens = 4096;
        const pct = Math.min(100, Math.round(tokens / maxTokens * 100));
        const fname = f.path.split('/').pop();
        const sizeStr = bytes < 1024 ? bytes + ' B' : (bytes / 1024).toFixed(1) + ' KB';

        body.innerHTML =
            '<div class="meta-row"><span class="meta-label">파일</span>' +
            '<span class="meta-value" style="font-size:10px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + fname + '</span></div>' +
            '<div class="meta-row"><span class="meta-label">라인 수</span><span class="meta-value">' + lines.length + '</span></div>' +
            '<div class="meta-row"><span class="meta-label">파일 크기</span><span class="meta-value">' + sizeStr + '</span></div>' +
            '<div class="meta-row"><span class="meta-label">해시</span><span class="meta-value" style="font-size:10px">' + f.hash + '</span></div>' +
            '<div class="progress-wrap">' +
            '<div class="progress-label"><span>예상 토큰</span><span>' + tokens.toLocaleString() + ' / ' + maxTokens.toLocaleString() + '</span></div>' +
            '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
            '</div>' +
            '<div class="quick-actions">' +
            '<button class="qa-btn" onclick="copyCode()">📄 파일 복사</button>' +
            '<button class="qa-btn" onclick="downloadFile()">📥 다운로드</button>' +
            '</div>';
    }

    function downloadFile() {
        if (activeIdx < 0) return;
        const f = FILES[activeIdx];
        const blob = new Blob([f.content], {type: 'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = f.path.split('/').pop();
        a.click();
        URL.revokeObjectURL(a.href);
    }

    async function copyAllConfig() {
        await ensureFilesLoaded();
        const text = FILES.map(function (f) {
            return '=== ' + f.path + ' ===' + NL + (f.content || '');
        }).join(NL + NL);
        navigator.clipboard.writeText(text).then(function () {
            const btn = document.querySelector('[onclick="copyAllConfig()"]');
            if (btn) {
                btn.textContent = '✓ Copied!';
                btn.style.color = '#68d391';
                setTimeout(function () {
                    btn.textContent = '📋 Copy All';
                    btn.style.color = '';
                }, 1800);
            }
        });
    }

    let guideRendered = false;

    let diffBaseFiles = null;
    let diffBaseHash = '';
    let diffSnapshots = [];

    function toggleDiff() {
        diffMode = !diffMode;
        document.getElementById('diffBtn').classList.toggle('active', diffMode);
        const codeWrap = document.getElementById('codeWrap');
        const diffPane = document.getElementById('diffPane');
        if (diffMode) {
            codeWrap.style.display = 'none';
            diffPane.classList.add('visible');
            renderDiff();
        } else {
            codeWrap.style.display = '';
            diffPane.classList.remove('visible');
        }
    }

    async function loadDiffSnapshots() {
        try {
            const res = await fetch('/snapshots');
            diffSnapshots = await res.json();
            const sel = document.getElementById('diffBaseSelect');
            const curHash = '__ROOT_HASH__';
            sel.innerHTML = '';
            let prevFound = false;
            diffSnapshots.forEach(function (s, i) {
                if (s.root_hash === curHash) return;
                const opt = document.createElement('option');
                opt.value = s.root_hash;
                opt.textContent = s.root_hash.slice(0, 12) + '  ' + (s.recorded_at || '').slice(0, 16);
                sel.appendChild(opt);
                if (!prevFound) {
                    prevFound = true;
                    sel.value = s.root_hash;
                }
            });
            if (!sel.options.length) {
                const opt = document.createElement('option');
                opt.value = '';
                opt.textContent = '이전 스냅샷 없음';
                sel.appendChild(opt);
            }
        } catch (e) {
            console.error('diff snapshots load error', e);
        }
    }

    async function onDiffBaseChange(hash) {
        if (!hash) return;
        diffBaseHash = hash;
        diffBaseFiles = null;
        try {
            const res = await fetch('/snapshot/' + hash + '/files');
            diffBaseFiles = await res.json();
            if (diffMode) renderDiff();
        } catch (e) {
            console.error('diff base load error', e);
        }
    }

    async function ensureDiffBase() {
        const sel = document.getElementById('diffBaseSelect');
        const hash = sel.value;
        if (!hash) return;
        if (diffBaseHash !== hash || !diffBaseFiles) {
            diffBaseHash = hash;
            diffBaseFiles = null;
            try {
                const res = await fetch('/snapshot/' + hash + '/files');
                diffBaseFiles = await res.json();
            } catch (e) {
                console.error('diff base load error', e);
            }
        }
    }

    function computeLcs(a, b) {
        const m = a.length, n = b.length;
        const dp = [];
        for (let i = 0; i <= m; i++) dp.push(new Int32Array(n + 1));
        for (let i = 1; i <= m; i++)
            for (let j = 1; j <= n; j++)
                dp[i][j] = a[i - 1] === b[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
        const lcs = [];
        let i = m, j = n;
        while (i > 0 && j > 0) {
            if (a[i - 1] === b[j - 1]) {
                lcs.push([i - 1, j - 1]);
                i--;
                j--;
            } else if (dp[i - 1][j] >= dp[i][j - 1]) i--;
            else j--;
        }
        return lcs.reverse();
    }

    function diffLines(oldLines, newLines) {
        if (oldLines.length > 300 || newLines.length > 300) {
            // 대용량: 단순 행 비교로 폴백
            const leftRows = [], rightRows = [];
            const maxLen = Math.max(oldLines.length, newLines.length);
            for (let i = 0; i < maxLen; i++) {
                const o = i < oldLines.length ? oldLines[i] : null;
                const n = i < newLines.length ? newLines[i] : null;
                const same = o !== null && n !== null && o === n;
                leftRows.push({
                    type: o === null ? 'empty' : (same ? 'same' : 'del'),
                    line: o || '',
                    ln: o !== null ? i + 1 : null
                });
                rightRows.push({
                    type: n === null ? 'empty' : (same ? 'same' : 'add'),
                    line: n || '',
                    ln: n !== null ? i + 1 : null
                });
            }
            return {leftRows, rightRows};
        }
        const lcs = computeLcs(oldLines, newLines);
        const leftRows = [], rightRows = [];
        let oi = 0, ni = 0;
        lcs.forEach(function (pair) {
            const [li, ri] = pair;
            while (oi < li) {
                leftRows.push({type: 'del', line: oldLines[oi], ln: oi + 1});
                rightRows.push({type: 'empty', line: '', ln: null});
                oi++;
            }
            while (ni < ri) {
                rightRows.push({type: 'add', line: newLines[ni], ln: ni + 1});
                leftRows.push({type: 'empty', line: '', ln: null});
                ni++;
            }
            leftRows.push({type: 'same', line: oldLines[oi], ln: oi + 1});
            rightRows.push({type: 'same', line: newLines[ni], ln: ni + 1});
            oi++;
            ni++;
        });
        while (oi < oldLines.length) {
            leftRows.push({type: 'del', line: oldLines[oi], ln: oi + 1});
            rightRows.push({type: 'empty', line: '', ln: null});
            oi++;
        }
        while (ni < newLines.length) {
            rightRows.push({type: 'add', line: newLines[ni], ln: ni + 1});
            leftRows.push({type: 'empty', line: '', ln: null});
            ni++;
        }
        return {leftRows, rightRows};
    }

    function esc(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderDiffTable(rows) {
        if (!rows.length) return '<div class="diff-no-change-notice">내용 없음</div>';
        const tbody = rows.map(function (r) {
            const cls = r.type === 'add' ? ' diff-add' : r.type === 'del' ? ' diff-del' : '';
            const ln = r.ln !== null ? r.ln : '';
            const prefix = r.type === 'add' ? '+' : r.type === 'del' ? '-' : ' ';
            return '<tr class="' + cls + '"><td class="diff-ln">' + ln + '</td><td class="diff-code">' + prefix + esc(r.line) + '</td></tr>';
        }).join('');
        return '<table class="diff-table"><tbody>' + tbody + '</tbody></table>';
    }

    async function renderDiff() {
        if (!diffMode) return;
        await ensureDiffBase();
        const leftEl = document.getElementById('diffLeft');
        const rightEl = document.getElementById('diffRight');
        const leftHeader = document.getElementById('diffLeftHeader');
        const rightHeader = document.getElementById('diffRightHeader');
        const curHash = '__ROOT_HASH__';

        if (!diffBaseFiles) {
            leftEl.innerHTML = '<div class="diff-no-change-notice">이전 스냅샷을 선택하세요</div>';
            rightEl.innerHTML = '';
            return;
        }

        const sel = document.getElementById('diffBaseSelect');
        const baseLabel = sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : diffBaseHash.slice(0, 12);
        leftHeader.textContent = '← ' + baseLabel.trim();
        rightHeader.textContent = '→ ' + curHash.slice(0, 12) + ' (현재)';

        if (activeIdx < 0) {
            leftEl.innerHTML = '<div class="diff-no-change-notice">좌측에서 파일을 선택하세요</div>';
            rightEl.innerHTML = '';
            return;
        }

        const f = FILES[activeIdx];
        const oldContent = diffBaseFiles[f.path] !== undefined ? diffBaseFiles[f.path] : null;
        const newContent = f.content || '';

        if (oldContent === null) {
            leftEl.innerHTML = '<div class="diff-no-change-notice" style="color:#fc8181">(파일 없음)</div>';
            rightEl.innerHTML = renderDiffTable(newContent.split(NL).map(function (l, i) {
                return {type: 'add', line: l, ln: i + 1};
            }));
            return;
        }

        if (oldContent === newContent) {
            leftEl.innerHTML = '<div class="diff-no-change-notice" style="color:#68d391">변경 없음</div>';
            rightEl.innerHTML = '<div class="diff-no-change-notice" style="color:#68d391">변경 없음</div>';
            return;
        }

        const {leftRows, rightRows} = diffLines(oldContent.split(NL), newContent.split(NL));
        leftEl.innerHTML = renderDiffTable(leftRows);
        rightEl.innerHTML = renderDiffTable(rightRows);
        // 스크롤 동기화
        leftEl.onscroll = function () {
            rightEl.scrollTop = leftEl.scrollTop;
        };
        rightEl.onscroll = function () {
            leftEl.scrollTop = rightEl.scrollTop;
        };
    }

    async function loadSnapshots() {
        try {
            const res = await fetch('/snapshots');
            const list = await res.json();
            const sel = document.getElementById('snapSelect');
            const curHash = '__ROOT_HASH__';
            list.forEach(function (s) {
                const opt = document.createElement('option');
                opt.value = s.root_hash;
                opt.textContent = s.root_hash.slice(0, 12) + '  ' + (s.recorded_at || '').slice(0, 16);
                if (s.root_hash === curHash) opt.selected = true;
                sel.appendChild(opt);
            });
        } catch (e) {
        }
    }

    function navigateSnapshot(hash) {
        if (hash) window.location.href = '/snapshot/' + hash;
    }

    document.getElementById('cmdSearch').addEventListener('input', function (e) {
        document.getElementById('searchInput').value = e.target.value;
        renderTree(e.target.value);
    });

    document.getElementById('searchInput').addEventListener('input', function (e) {
        renderTree(e.target.value);
    });

    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
            e.preventDefault();
            document.getElementById('cmdSearch').focus();
            document.getElementById('cmdSearch').select();
        }
    });

    function collectKeys(node, prefix) {
        Object.keys(node.dirs).forEach(function (seg) {
            const k = prefix ? prefix + '/' + seg : seg;
            openFolders.add(k);
            collectKeys(node.dirs[seg], k);
        });
    }

    collectKeys(buildTree(FILES), '');
    renderTree('');
    updateTokenBadge();
    loadSnapshots();
    loadDiffSnapshots();
    // inspector 기본 열림
    document.getElementById('split').classList.add('inspector-open');
    document.getElementById('inspectorBtn').classList.add('active');
    updateInspector();

    (async function () {
        const hash = location.hash;
        if (hash.startsWith('#file=')) {
            const targetPath = decodeURIComponent(hash.slice(6));
            const idx = FILES.findIndex(function (f) {
                return f.path === targetPath;
            });
            if (idx >= 0) {
                await selectFile(idx);
                return;
            }
        }
        if (FILES.length > 0) await selectFile(0);
    })();
